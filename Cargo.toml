[package]
name = "envwrap"
version = "0.3.0-rc.1"
edition = "2024"
description = "Linux transparent proxy and declared container identity with native application configuration"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jacek4yang/envwrap"

[lib]
name = "envwrap"
path = "src/lib.rs"

[[bin]]
name = "envwrap"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
ipnet = { version = "2", features = ["serde"] }
tempfile = "3"
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
